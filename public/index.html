<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="배움일기 사진을 올리면 맞춤법·띄어쓰기·문장을 아빠랑 함께 고쳐 보는 학습 도구">
<meta name="color-scheme" content="light dark">
<title>배움일기 빨간펜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="masthead">
  <div class="masthead-in">
    <svg class="mark" viewBox="0 0 128 64" role="img" aria-label="아빠와 연필로 일기를 쓰는 아이">
      <!-- 아빠 -->
      <path d="M13 64c0-14 11-21 25-21s25 7 25 21Z" fill="var(--pen)"/>
      <circle cx="38" cy="30" r="15" fill="var(--skin)"/>
      <path d="M23 30c0-10 6-17 15-17s15 7 15 17c0-6-3-10-9-11-6-1-11 1-15 4-3 2-5 5-6 7Z" fill="var(--hair)"/>
      <circle cx="32" cy="32" r="4.7" fill="none" stroke="var(--ink)" stroke-width="1.7"/>
      <circle cx="45" cy="32" r="4.7" fill="none" stroke="var(--ink)" stroke-width="1.7"/>
      <path d="M36.7 32h3.6" stroke="var(--ink)" stroke-width="1.7"/>
      <path d="M34 40q4 3 8 0" stroke="var(--ink)" stroke-width="1.8" stroke-linecap="round" fill="none"/>
      <!-- 아이 -->
      <path d="M70 64c0-12 10-18 22-18s22 6 22 18Z" fill="var(--mark)"/>
      <circle cx="92" cy="33" r="12" fill="var(--skin)"/>
      <path d="M80 33c0-8 5-14 12-14s12 6 12 14c0-5-4-8-12-8s-12 3-12 8Z" fill="var(--hair)"/>
      <path d="M85 33q2.5 3 5 0" stroke="var(--ink)" stroke-width="1.7" stroke-linecap="round" fill="none"/>
      <path d="M94 33q2.5 3 5 0" stroke="var(--ink)" stroke-width="1.7" stroke-linecap="round" fill="none"/>
      <path d="M89 40q3 2.5 6 0" stroke="var(--ink)" stroke-width="1.6" stroke-linecap="round" fill="none"/>
      <!-- 펼친 공책 -->
      <path d="M67 62q12-7 25-3V47q-13-4-25 3Z" fill="var(--paper-2)" stroke="var(--ink)" stroke-width="1.7" stroke-linejoin="round"/>
      <path d="M117 62q-12-7-25-3V47q13-4 25 3Z" fill="var(--paper-2)" stroke="var(--ink)" stroke-width="1.7" stroke-linejoin="round"/>
      <path d="M97 53h13M97 57h10" stroke="var(--rule)" stroke-width="1.5" stroke-linecap="round"/>
      <!-- 연필 쥔 손 -->
      <g transform="translate(107 48) rotate(-40)">
        <rect x="0" y="-3.1" width="21" height="6.2" rx="1.6" fill="#E4A93C"/>
        <rect x="17" y="-3.1" width="4" height="6.2" rx="1.6" fill="var(--mark)"/>
        <path d="M0-3.1-6.4 0 0 3.1Z" fill="#EBD3B0"/>
        <path d="M-3.9-1.3-6.4 0-3.9 1.3Z" fill="#2B2B2B"/>
      </g>
      <circle cx="108" cy="49" r="4.4" fill="var(--skin)" stroke="var(--ink)" stroke-width="1.3"/>
    </svg>
    <div class="wordmark">
      <b>배움일기 빨간펜</b>
      <span>아빠랑 함께 고쳐요</span>
    </div>
  </div>
</header>

<nav class="rail" id="rail" aria-label="진행 단계"></nav>

<main id="app" aria-live="polite"></main>

<script src="app.js"></script>
</body>
</html>
