name = "happy-learning-diary"
main = "worker/index.js"
compatibility_date = "2026-08-01"

# 정적 파일(index.html, app.js, style.css)을 워커가 함께 서빙한다.
[assets]
directory = "./public"
binding = "ASSETS"

[vars]
# 배포 후 실제 도메인으로 바꿀 것. 비워 두면 요청이 도착한 자기 origin 만 허용된다.
ALLOWED_ORIGINS = ""
DAILY_CALL_LIMIT = "500"
DAILY_PER_IP_LIMIT = "60"

# 일일 호출 상한 카운터용 KV. (2026-08-30 생성)
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "84c9491537374e86b6c14e0e32da20f2"

# GEMINI_API_KEY 는 vars 가 아니라 secret 으로 넣는다:
#   npx wrangler secret put GEMINI_API_KEY
